name: Release

# Push a tag like v1.0.6 to build a signed AAB + APK and publish them as a GitHub Release.
# The tag must match versionName in version.properties (bump it locally first).
# "Run workflow" (workflow_dispatch) builds and uploads the files as a run artifact only.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Restores the Gradle cache written by ci.yml on main (tag refs can read but not usefully write it).
      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches version.properties
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          name="$(grep '^versionName=' version.properties | cut -d= -f2- | tr -d '\r')"
          if [[ "${GITHUB_REF_NAME#v}" != "$name" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match versionName=${name} in version.properties"
            exit 1
          fi

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          keyAlias=$KEY_ALIAS
          PROPS

      - name: Build signed AAB and APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease

      - name: Name artifacts
        run: |
          mkdir dist
          name="$(grep '^versionName=' version.properties | cut -d= -f2- | tr -d '\r')"
          cp app/build/outputs/bundle/release/app-release.aab "dist/garagedoor-v${name}.aab"
          cp app/build/outputs/apk/release/app-release.apk "dist/garagedoor-v${name}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes
