name: CI

# Builds and tests on main and PRs. Besides catching breakage, runs on main populate the Gradle
# cache that release.yml (tag builds) restores: GitHub only lets tag/PR refs read caches created
# on the default branch, so release builds are fast only if main has built recently.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Writes the cache on main; read-only on PRs (default behavior).
      - uses: gradle/actions/setup-gradle@v4

      # Unsigned release build (no keystore.properties) so release-variant dependencies get cached too.
      - run: ./gradlew testDebugUnitTest assembleRelease bundleRelease
